[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mousearm"
version = "0.1.0"
description = "A cool mouse arm!"
readme = "README.md"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.10.0",
    "scipy>=1.15.0",
    "pillow",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mousearm = ["model_toScale.osim", "*.xml", "*.osim", "*.trc", "GeomJan01242023/*"]